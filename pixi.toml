[workspace]
authors = ["GAI-313 <nakatogawagai@gmail.com>"]
channels = ["conda-forge", "robostack-humble"]
name = "nakalab_so101"
platforms = [
  { platform = "osx-64", macos = "14.0" },
  { platform = "osx-arm64", macos = "14.0" }
]
version = "0.1.0"

[activation.env]
# ROS2
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/cyclonedds.xml"
RMW_IMPLEMENTATION="rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE="SUBNET"
ROS_DOMAIN_ID="0"

[activation]
scripts = ["install/setup.sh"]

[tasks]
vcs = "vcs import . < depends.repos"
pip_requirements = "python -m pip install -r requirements.txt"
colcon_build = {cmd = "colcon build --symlink-install --packages-up-to nakalab_so101_py nakalab_so101_teleop", depends-on=["vcs", "pip_requirements"]}
description = "ros2 launch nakalab_so101_description display.launch.py use_rviz:=true use_jspg:=true"
find_port = "ros2 run nakalab_so101_py find_port"
setup_motors = "ros2 run nakalab_so101_py setup_motors"
calibrate = "ros2 run nakalab_so101_py calibrate"
follower_arm_py = "ros2 run nakalab_so101_py follower_arm_driver_node"
teleop = "ros2 launch nakalab_so101_teleop teleop.launch.py"

[dependencies]
# python
python = "3.11.*"
pip = "*"
pyserial = "*"
setuptools = "<70.0.0"

# develop tools
vcstool = "*"
ros-dev-tools = "*"
cxx-compiler = "1.*"

# cpp
qt-main = ">=5.15.15,<6"
yaml-cpp = ">=0.8.0,<0.9"
libarrow-all = ">=17.0.0,<18"
nlohmann_json = ">=3.11.2,<4"

# ROS2
ros-humble-desktop = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
# depends
ros-humble-cv-bridge = "*"
ros-humble-sensor-msgs = "*"
ros-humble-rviz2 = "*"
ros-humble-xacro = "*"
ros-humble-robot-state-publisher = "*"
ros-humble-joint-state-publisher-gui = "*"
ros-humble-ament-index-cpp = "*"
ros-humble-rosbag2-cpp = "*"
ros-humble-rosbag2-storage = "*"
# rosbag
ros-humble-ros2bag = "*"
ros-humble-rosbag2-storage-mcap = "*"
