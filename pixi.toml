[workspace]
authors = ["GAI-313 <nakatogawagai@gmail.com>"]
channels = ["conda-forge", "robostack-jazzy"]
name = "nakalab_so101"
platforms = ["osx-64", "osx-arm64"]
version = "0.1.0"

[activation.env]
# ROS2
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/cyclonedds.xml"
RMW_IMPLEMENTATION="rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE="SUBNET"
ROS_DOMAIN_ID="0"

[activation]
scripts = ["install/setup.sh"]

[tasks]
colcon_build = "colcon build --symlink-install --packages-up-to ngsr_so101_py"

[dependencies]
# python
python = "3.12.*"
pyserial = "*"
setuptools = "<70.0.0"

# develop tools
vcstool = "*"
ros-dev-tools = "*"

# ROS2
ros-jazzy-desktop = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
