controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    so101_follower_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    so101_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

so101_follower_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false

so101_gripper_controller:
  ros__parameters:
    joints:
      - gripper
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false
